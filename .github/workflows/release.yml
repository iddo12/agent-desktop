name: Release

# Windows CI minutes cost double, so this only ever runs when it's actually
# building a release - a version tag being pushed, or someone deliberately
# asking for one - never on every push/PR.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # softprops/action-gh-release needs this to create the draft release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer and portable zip
        run: npm run dist

      - name: Create a draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.zip
